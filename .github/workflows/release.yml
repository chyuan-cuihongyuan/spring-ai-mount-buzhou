name: Release

# 打 release tag（v*）后触发：经 release profile 对全量构件做 GPG 签名并上传 Central Portal staging。
# deploy 生命周期内含 verify，因此本 workflow 同时复跑构建与测试作为发布前守门（spec 09 发布时序）。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # GPG：从 base64 密钥 Secret 还原并导入；maven-gpg-plugin 以默认 keyring + loopback 密码签名。
      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import

      # Central Portal 凭证：写入 settings.xml 的 <server id="central">，
      # 与父 POM central-publishing-maven-plugin 的 publishingServerId 对齐。
      # heredoc 定界符加引号，防止 shell 展开 ${env.*}，交由 Maven 运行期解析。
      - name: Configure Central Portal credentials
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'EOF'
          <settings>
            <servers>
              <server>
                <id>central</id>
                <username>${env.CENTRAL_USERNAME}</username>
                <password>${env.CENTRAL_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Build, sign & deploy to Central Portal staging
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B -Prelease deploy
