# 性能基准 nightly（T93 / impl-68 / spec 21）：-Dgroups=perf 激活 @Tag("perf") 哨兵基准。
name: perf-nightly

on:
  schedule:
    - cron: '0 5 * * 1' # 每周一 05:00（与 supply-chain 04:00 错峰）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  perf-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run perf baseline sentinels
        run: >
          ./mvnw -B clean test -pl examples -am -DskipTests=false
          -Dsurefire.excluded.groups= -Dgroups=perf
          -Dsurefire.reportsDirectory=target/perf-surefire-reports

      - name: Collect perf stdout metrics
        if: always()
        run: |
          mkdir -p target/perf-report
          grep -h "\[perf\]" examples/target/perf-surefire-reports/*.txt > target/perf-report/metrics.txt || true
          cat target/perf-report/metrics.txt || true

      - name: Upload perf report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-baseline
          path: |
            target/perf-report/metrics.txt
            examples/target/perf-surefire-reports/
          if-no-files-found: ignore
