name: spotbugs

# impl-54：SpotBugs 观测起步；impl-70 / spec 21 升硬门——High 优先级发现 = 失败
# （排除清单 spotbugs-exclude.xml 渐进清偿：排除项须带 issue 注记，禁止无解释豁免）。
on:
  schedule:
    - cron: '0 21 * * 2'  # 每周二 UTC 21:00
  workflow_dispatch: {}

jobs:
  spotbugs:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # 硬门：threshold=High 只卡高危；Medium 及以下仍随报告归档观测（首条 High 出现即失败）
      - name: SpotBugs analyze (hard gate on High)
        run: mvn -B -ntp com.github.spotbugs:spotbugs-maven-plugin:4.8.6.6:spotbugs -DskipTests -Dspotbugs.effort=Default -Dspotbugs.threshold=High
      - name: Upload SpotBugs reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-reports
          path: '**/target/spotbugsXml.xml'
          if-no-files-found: ignore
