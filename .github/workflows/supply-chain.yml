# 供应链观测（T92 / impl-67 / spec 21）：SBOM 生成上传 + OWASP dependency-check 观测档。
# 不卡门（|| true，对齐 spotbugs 观测先例）；NVD key 经 secret 可选注入（无 key 降级慢速）。
name: supply-chain

on:
  schedule:
    - cron: '0 4 * * 1' # 每周一 04:00（本地时区口径，与 spotbugs nightly 错峰）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom-and-dependency-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build SBOM (CycloneDX aggregate, json+xml)
        run: ./mvnw -B -Psupply-chain -DskipTests package

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: |
            target/bom.json
            target/bom.xml
          if-no-files-found: error

      # 观测档：发现即报告，不卡门。NVD_API_KEY secret 可选（无 key 时 NVD 数据源降级慢速，
      # 依赖 NPM/central 等兜底源；长时间下载失败由 || true 吸收，报告工件仍尽量产出）。
      - name: OWASP dependency-check (observational)
        continue-on-error: true
        run: >
          ./mvnw -B org.owasp:dependency-check-maven:12.1.0:aggregate
          -Dformat=HTML,JSON
          -DnvdApiKey=${{ secrets.NVD_API_KEY }}
          || true

      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.*
          if-no-files-found: ignore
